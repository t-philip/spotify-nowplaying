; IdeaSpeak — Spotify Now-Playing Display
; Built to a full design spec — see README.md for an architecture overview.

[env:ideaspeak]
platform      = espressif32@^6.5.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
; Serial port: PlatformIO auto-detects by default. Uncomment and set these
; only if it picks the wrong one (e.g. COM5 on Windows, /dev/ttyUSB0 on Linux).
; upload_port   = COM5
; monitor_port  = COM5

; Default 4MB partition table leaves only ~1.2MB for the app.
; TLS + TFT_eSPI + ArduinoJson + JPEG decoder + web server will exceed it.
board_build.partitions = min_spiffs.csv   ; ~1.9MB app partition

build_flags =
  ; ---- TFT_eSPI configuration (avoids editing User_Setup.h) ----
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=135
  -DTFT_HEIGHT=240
  -DCGRAM_OFFSET=1
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DTFT_BL=32
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD -DLOAD_FONT2 -DLOAD_FONT4 -DLOAD_FONT6 -DLOAD_GFXFF
  -DSMOOTH_FONT
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  ; ---- App ----
  -DCORE_DEBUG_LEVEL=3
  -DARDUINOJSON_ENABLE_ARDUINO_STREAM=1

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bodmer/TJpg_Decoder @ ^1.1.0
  bblanchon/ArduinoJson @ ^7.0.4
  tzapu/WiFiManager @ ^2.0.17
  ; Not in the original spec's lib_deps list, but §12.5 requires a QR code
  ; on the AUTH_NEEDED screen (encoding only the short http://ideaspeak.local
  ; URL, version 2 — see ui/screens.cpp) and nothing else in this list
  ; generates one.
  ricmoo/QRCode @ ^0.0.1
